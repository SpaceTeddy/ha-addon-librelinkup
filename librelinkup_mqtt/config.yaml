name: LibreLinkUp MQTT
version: "1.0.29"
slug: librelinkup_mqtt
description: Fetch LibreLinkUp data and publish to MQTT (raw + filtered)
url: https://github.com/SpaceTeddy/ha-addon-librelinkup

arch:
  - amd64
  - aarch64
  - armv7

init: false
startup: application
boot: auto
stage: stable

# Discovery/UDP/MDNS
host_network: true

# if TLS-CA refers from /config :
map:
  - config:ro

services:
  - mqtt:need

options:
  email: ""
  password: ""

  interval: 60
  fetch_offset: 5.0
  fetch_offset_target_lag: 5.0
  tz: "Europe/Berlin"

  # Scheduler
  adaptive_lag: true
  poll_seconds: 10.0
  poll_max_seconds: 120.0
  stale_poll_seconds: 30.0

  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_base_topic: "librelinkup"
  master_id: "MASTER"

  publish_raw: false
  publish_filtered: true
  mqtt_retain: true
  mqtt_qos: 0
  mqtt_publish_on_change: true
  mqtt_force_publish_seconds: 60

  mqtt_publish_health: true
  mqtt_health_retain: true

  debug: false
  log_level: "INFO"

schema:
  email: str
  password: password

  interval: int(10,3600)
  fetch_offset: float(0,60)
  fetch_offset_target_lag: float(0,60)
  tz: str

  adaptive_lag: bool
  poll_seconds: float(1,60)
  poll_max_seconds: float(10,600)
  stale_poll_seconds: float(5,600)

  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  mqtt_base_topic: str
  master_id: str

  publish_raw: bool
  publish_filtered: bool
  mqtt_retain: bool
  mqtt_qos: int(0,2)
  mqtt_publish_on_change: bool
  mqtt_force_publish_seconds: float(0,3600)

  mqtt_publish_health: bool
  mqtt_health_retain: bool

  

  debug: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
