name: Manueller Build & Publish (Branch-Auswahl)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: spaceteddy/librelinkup_mqtt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (gewählter Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Version hochzählen und config.yaml aktualisieren
        id: ver
        shell: bash
        run: |
          CURRENT=$(grep -E '^version:' librelinkup_mqtt/config.yaml | head -n1 | sed -E 's/^[^"]*"([^"]+)".*/\1/')
          echo "Aktuelle Version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Neue Version: $NEW"

          sed -i "s/^version: \".*\"/version: \"${NEW}\"/" librelinkup_mqtt/config.yaml

          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Versionsänderung committen und pushen (Branch + main)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Version auf dem gewählten Branch committen
          git add librelinkup_mqtt/config.yaml
          git commit -m "Bump version to ${{ steps.ver.outputs.version }}"
          git push

          # Version auch auf main eintragen, damit HA das Update erkennt
          git fetch origin main
          git checkout main
          sed -i "s/^version: \".*\"/version: \"${{ steps.ver.outputs.version }}\"/" librelinkup_mqtt/config.yaml
          git add librelinkup_mqtt/config.yaml
          git commit -m "Bump version to ${{ steps.ver.outputs.version }} [skip ci]" || echo "main already up to date"
          git push origin main
          git checkout ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags vorbereiten
        id: prep
        shell: bash
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Baue Tags: $TAGS"

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./librelinkup_mqtt
          file: ./librelinkup_mqtt/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
